<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Monkey Business Festival</title>
    <link rel="stylesheet" href="css/festival.css">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            
            <div><h1>Monkey Business Festival</h1><p>Contact Us</p></div>
        </div>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="info.html">Info</a>
            <a href="LostAndFound/lost-found.html">Lost &amp; Found</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Monkey Business</h2>
            <p>Email: info@monkeybiz.com</p>
            <p>Phone: (909) 555-0260</p>
            <address>Jungle Grounds Festival Park<br>1000 Banana Grove Drive<br>San Bernardino, CA 92408</address>
        </section>

        <section>
            <h2>Send Us a Message</h2>
            <form>
                <div class="form-group"><label for="name">Name</label><input id="name" name="name" type="text" required></div>
                <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject">
                        <option value="general">General Question</option>
                        <option value="parking">Parking</option>
                        <option value="accessibility">Accessibility</option>
                        <option value="lost-found">Lost &amp; Found</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group"><label for="message">Message</label><textarea id="message" name="message" rows="6" required></textarea></div>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer class="site-footer"><p>&copy; 2026 Monkey Business Festival</p></footer>
</body>
</html>
